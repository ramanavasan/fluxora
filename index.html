<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Fluxora — Technology Crafted for All, Not Machines</title>
  <meta name="description"
    content="Fluxora creates clear, intuitive, and accessible digital experiences shaped by real human behaviour. 150+ projects delivered. 98% client satisfaction." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://fluxora.io/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://fluxora.io/" />
  <meta property="og:title" content="Fluxora — Technology Crafted for All, Not Machines" />
  <meta property="og:description"
    content="Fluxora creates clear, intuitive, and accessible digital experiences shaped by real human behaviour. 150+ projects delivered. 98% client satisfaction." />
  <meta property="og:site_name" content="Fluxora" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Fluxora — Technology Crafted for All, Not Machines" />
  <meta name="twitter:description"
    content="Fluxora creates clear, intuitive, and accessible digital experiences shaped by real human behaviour. 150+ projects delivered. 98% client satisfaction." />

  <!-- Favicon & theme -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#120400" />

  <!-- JSON-LD structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fluxora",
      "url": "https://fluxora.io/",
      "description": "Fluxora creates clear, intuitive, and accessible digital experiences shaped by real human behaviour.",
      "foundingDate": "2024",
      "numberOfEmployees": { "@type": "QuantitativeValue", "value": 50 },
      "slogan": "Technology Crafted for All, Not Machines"
    }
    </script>

  <!-- Fonts — preconnect first, then async load with display=swap already in URL -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
      Load only what we use:
        Inter Tight 500;600;700  → display headings
        Inter 400;500            → body (dropped weight 600 — unused)
        Instrument Serif italic  → hero <em>
    -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500&family=Instrument+Serif:ital@1&display=swap" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
